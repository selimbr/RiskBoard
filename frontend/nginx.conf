server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # "backend" est le nom du service défini dans docker-compose.yml,
    # résolu via le DNS interne de Docker. Le build de prod appelle /api en
    # relatif (voir src/environments/environment.prod.ts) : c'est ce proxy
    # qui fait le lien vers le vrai backend, sans jamais coder d'URL absolue
    # dans le bundle Angular.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
